name: Chocolatine

on:
  push:
    branches-ignore:
      - 'no-ga/**'
  pull_request:
    branches-ignore:
      - 'no-ga/**'

env:
  MIRROR_SSH_URL: git@github.com:EpitechPGE1-2025/G-DOP-200-COT-2-1-chocolatine-18.git
  EXECUTABLES: exec

jobs:
  check_compilation_and_coding_style:
    name: Compilation and coding_style
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker
    steps:
      - name: Check repo
        uses: actions/checkout@v4
      - name: Run banana-check-repo
        run: banana-check-repo
      - name: compile
        timeout-minutes: 2
        env:
          CC: epiclang
        run: make
      -name: Display coding-style erro
             run: |
               if [ -f coding-style-reports.log ]; then
                 while IFS=read -r line; do
                   file=$(echo "$line" | cut -d':' -f1)
                   lineno=$(echo "$line" | cut -d':' -f2)
                   severity=$(echo "$line" | cut -d':' -f3)
                   message=$(echo "$line" | cut -d':' -f4)
                   echo "::error file-$file,line=$lineno::$severity:$message"
                   done < coding-style-reports.log
                 fi
      -name: Faillure if coding-style error
             run: |
               if [ -f coding-style-reports.log ] && [ -s coding-style-reports.log ]; then
                 exit 1
               fi